<!--Used AI to create an about me page to fill Nav-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Contact Us | The Gaming Store</title>
</head>
<body>
  <div class="loader-overlay" aria-hidden="true">
    <div class="loader-content">
      <div class="loader-word">
        <span>L</span>
        <span class="loader-o"><span class="loader-spinner"></span></span>
        <span>a</span>
        <span>d</span>
        <span>i</span>
        <span>n</span>
        <span>g</span>
        <span>.</span>
        <span>.</span>
        <span>.</span>
      </div>
      <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>
  </div>
  <div class="hero-image">
    <div class="hero-text">
      <h1>Contact Us</h1>
      <p>Questions about an order or a product? Send us a message.</p>
      <button onclick="window.location.href='product.html'">LEVEL UP!!</button>
    </div>
  </div>
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="./about.html">About</a></li>
      <li><a href="./faq.html">FAQ</a></li>
      <li><a href="./contact.html">Contact</a></li>
    </ul>
  </nav>
  <main class="contact">
    <section class="contact-info">
      <h2>Get in Touch</h2>
      <ul class="about-list">
        <li><strong>Email:</strong> <a href="mailto:hello@thegamingstore.co.za">hello@thegamingstore.co.za</a></li>
        <li><strong>Phone:</strong> <a href="tel:+27210000000">+27 21 000 0000</a></li>
        <li><strong>Hours:</strong> Mon–Fri, 9:00–17:00 SAST</li>
        <li><strong>Location:</strong> Cape Town, South Africa</li>
      </ul>
    </section>

    <section class="contact-form-section">
      <h2>Send a Message</h2>
      <form class="contact-form" action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject</label>
        <select id="subject" name="subject">
          <option value="order">Order question</option>
          <option value="product">Product question</option>
          <option value="returns">Returns</option>
          <option value="other">Other</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
