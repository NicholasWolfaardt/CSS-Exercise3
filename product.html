<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>The Gaming Store</title>
</head>
<body>
  <div class="loader-overlay" aria-hidden="true">
    <div class="loader-content">
      <div class="loader-word">
        <span>L</span>
        <span class="loader-o"><span class="loader-spinner"></span></span>
        <span>a</span>
        <span>d</span>
        <span>i</span>
        <span>n</span>
        <span>g</span>
        <span>.</span>
        <span>.</span>
        <span>.</span>
      </div>
      <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>
  </div>
  <div class="hero-image">
    <div class="hero-text">
      <h1>Welcome to the Gaming Store</h1>
      <p>Do you want to level up your gear?</p>
      <button onclick="window.location.href='product.html'">LEVEL UP!!</button>
    </div>
  </div>
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="./about.html">About</a></li>
      <li><a href="./contact.html">Contact</a></li>
      <li><a href="./faq.html">FAQ</a></li>
    </ul>
  </nav>
  <main class="grid">
    <div class="holographic-container">
      <div class="card">
        <img src="https://m.media-amazon.com/images/I/71amTCrzOdL._AC_SX679_.jpg" alt="Ghast Headphones">
        <p><label>Ghast Headphones</label></p>
        <p><label>R 3999</label></p>
        <button class="cart">Add to Cart</button>
      </div>
    </div>
    <div class="holographic-container">
      <div class="card">
        <img src="https://m.media-amazon.com/images/I/61l1VOHokOL._AC_SX679_.jpg" alt="Yellow Wolverine PS5 Dualsense">
        <p><label>Yellow Wolverine PS5 Dualsense</label></p>
        <p><label>R 1499</label></p>
        <button class="cart">Add to Cart</button>
      </div>
    </div>
    <div class="holographic-container">
      <div class="card">
        <img src="https://www.stormforcegaming.co.uk/wp-content/uploads/2026/05/Mouse-block-1000x1000.webp" alt="Cable Guy: DoomSlayer">
        <p><label>Razer Black Gaming Mouse</label></p>
        <p><label>R 397</label></p>
        <button class="cart">Add to Cart</button>
      </div>
    </div>
    <div class="holographic-container">
      <div class="card">
        <img src="https://sonyworld.co.za/cdn/shop/files/ACCESS_SA_RNDR_FT_RGB_MEA_231002.jpg?" alt="Playstation 5 Access Controller">
        <p><label>Playstation 5 Access Controller</label></p>
        <p><label>R 999</label></p>
        <button class="cart">Add to Cart</button>
      </div>
    </div>
    <div class="holographic-container">
      <div class="card">
        <img src="https://www.mhcworld.co.za/cdn/shop/files/transparent-Photoroom_21_7f615aef-4e55-4465-916c-a359e4e29214.jpg?" alt="Logitech G920/G29 Driving Force Steering Wheel and Pedals">
        <p><label>Logitech G920/G29 Driving Force Steering Wheel and Pedals</label></p>
        <p><label>R 6099</label></p>
        <button class="cart">Add to Cart</button>
      </div>
    </div>
    <div class="holographic-container">
      <div class="card">
        <img src="https://backbone.com/cdn/shop/files/backbone_pro_carousel_1_ab9abf9b-48da-4f9a-83d6-ae8e7ba833e6.png?v=1784917416&width=1200" alt="Backbone Pro Mobile Gaming">
        <p><label>Backbone Pro Mobile Gaming</label></p>
        <p><label>R 2786</label></p>
        <button class="cart">Add to Cart</button>
      </div>
    </div>
  </main>
</body>
</html>
